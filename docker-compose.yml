services:
  postgres:
    image: postgres:16
    container_name: souk-postgres
    environment:
      POSTGRES_DB: souk
      POSTGRES_USER: souk
      POSTGRES_PASSWORD: souk
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  adminer:
    image: adminer
    container_name: souk-adminer
    ports:
      - "8081:8080"

volumes:
  pgdata:
